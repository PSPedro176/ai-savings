resources:
  jobs:
    leaderboard:
      name: aa-leaderboard-${bundle.target}

      # Roda toda segunda às 8h (semanal).
      schedule:
        quartz_cron_expression: '0 0 8 ? * MON'
        timezone_id: America/Sao_Paulo
        pause_status: UNPAUSED

      tasks:
        # 1) Coleta o leaderboard da AA e (re)cria o schema/tabela aa_leaderboard.
        - task_key: refresh_leaderboard
          # Sem cluster declarado => roda em compute serverless.
          notebook_task:
            notebook_path: ../aa_leaderboard.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              table: ${var.table}
              secret_scope: ${var.secret_scope}
              secret_key: ${var.secret_key}

        # 2) Views (CREATE OR REPLACE, idempotentes) — recriadas em TODO run para aplicar
        #    a definição atual do repo (sem gate: o gate antigo pulava atualizações).
        - task_key: create_v_model_usage_daily
          depends_on:
            - task_key: refresh_leaderboard
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../ddl/v_model_usage_daily.sql
              source: WORKSPACE

        - task_key: create_v_aa_model_ref
          depends_on:
            - task_key: refresh_leaderboard
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../ddl/v_aa_model_ref.sql
              source: WORKSPACE

        # 3) v_model_ref (AA + disponibilidade Databricks) — depende de v_aa_model_ref.
        - task_key: create_v_model_ref
          depends_on:
            - task_key: create_v_aa_model_ref
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../ddl/v_model_ref.sql
              source: WORKSPACE

        # 4) Materializa a referência (CTAS de v_model_ref) que o app lê via warehouse.
        - task_key: create_model_ref_snapshot
          depends_on:
            - task_key: create_v_model_ref
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../ddl/model_ref_snapshot.sql
              source: WORKSPACE
