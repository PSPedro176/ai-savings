resources:
  jobs:
    leaderboard:
      name: aa-leaderboard-${bundle.target}

      # Roda toda segunda às 8h (semanal).
      schedule:
        quartz_cron_expression: '0 0 8 ? * MON'
        timezone_id: America/Sao_Paulo
        pause_status: UNPAUSED

      tasks:
        # 1) Coleta o leaderboard da AA, cria o schema/tabela e sinaliza (task value
        #    create_needed) se as views ainda não existem.
        - task_key: refresh_leaderboard
          # Sem cluster declarado => roda em compute serverless.
          notebook_task:
            notebook_path: ../aa_leaderboard.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              table: ${var.table}
              secret_scope: ${var.secret_scope}
              secret_key: ${var.secret_key}

        # 2) Gate: só cria as views quando alguma delas não existe (1ª execução pós-deploy).
        - task_key: views_missing
          depends_on:
            - task_key: refresh_leaderboard
          condition_task:
            left: "{{tasks.refresh_leaderboard.values.create_needed}}"
            op: EQUAL_TO
            right: "true"

        # 3) Cria as duas views EM PARALELO (ambas só dependem do gate = true).
        - task_key: create_v_model_usage_daily
          depends_on:
            - task_key: views_missing
              outcome: "true"
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../ddl/v_model_usage_daily.sql
              source: WORKSPACE

        - task_key: create_v_aa_model_ref
          depends_on:
            - task_key: views_missing
              outcome: "true"
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../ddl/v_aa_model_ref.sql
              source: WORKSPACE

        # 4) v_model_ref (AA + disponibilidade Databricks) — depende de v_aa_model_ref.
        - task_key: create_v_model_ref
          depends_on:
            - task_key: create_v_aa_model_ref
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../ddl/v_model_ref.sql
              source: WORKSPACE
