bundle:
  name: ai_savings

include:
  - resources/*.yml

variables:
  catalog:
    description: Catálogo Unity Catalog de destino
    default: main
  schema:
    description: Schema de destino
    default: ai_savings
  table:
    description: Tabela do leaderboard
    default: aa_leaderboard
  secret_scope:
    description: Secret scope com a chave da API Artificial Analysis
    default: ai_savings
  secret_key:
    description: Chave (key) dentro do secret scope
    default: aa_api_key
  warehouse_id:
    description: SQL Warehouse que executa o dashboard AI Savings
    default: 8edbc02ddff2de2d

targets:
  dev:
    default: true
    mode: development
    workspace:
      profile: perdomo
    variables:
      catalog: perdomo_demos_catalog

  prod:
    mode: production
    workspace:
      profile: perdomo
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: perdomo_demos_catalog
      schema: ai_savings
