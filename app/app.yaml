# Config do Databricks App: sobe o FastAPI (serve a API + o SPA em frontend/dist).
command:
  - "uvicorn"
  - "app:app"
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "8000"

env:
  # Referência de modelos (lida via SQL Warehouse).
  - name: WAREHOUSE_ID
    value: "8edbc02ddff2de2d"
  - name: MODEL_REF_VIEW
    value: "perdomo_demos_catalog.ai_savings.model_ref_snapshot"

  # Conexão Lakebase: PG* são injetados pelo binding `lakebase` (resources/app.yml).
  # A senha é gerada em runtime (server/db.py); PGUSER cai para o client id do SP.
  - name: PGHOST
    valueFrom: lakebase
  - name: PGPORT
    valueFrom: lakebase
  - name: PGDATABASE
    valueFrom: lakebase
  - name: PGUSER
    valueFrom: lakebase
  # Endpoint do Lakebase para gerar a database credential (branch = target).
  - name: LAKEBASE_ENDPOINT_PATH
    value: "projects/ai-savings/branches/dev/endpoints/primary"
